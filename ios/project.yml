# XcodeGen spec: `cd ios && xcodegen` generates Fade.xcodeproj (which is not committed).
name: Fade
options:
  bundleIdPrefix: com.dschermer
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Fade:
    type: application
    platform: iOS
    sources: [Fade]
    dependencies:
      - package: Supabase
    # TURN ON once the paid Apple Developer account is active (a free Personal Team can't sign it):
    # entitlements:
    #   path: Fade/Fade.entitlements
    #   properties:
    #     com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dschermer.fade
        PRODUCT_NAME: Fade
        DEVELOPMENT_TEAM: ""   # <- your 10-character Apple Team ID (see SETUP.md)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fade
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
